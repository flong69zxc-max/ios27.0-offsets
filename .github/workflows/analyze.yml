name: Extract iOS 27 Kernel Offsets
on: workflow_dispatch

jobs:
  analyze:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify zip
        run: |
          ls -la kernel.zip
          file kernel.zip

      - name: Unzip kernel
        run: |
          unzip -o kernel.zip
          ls -la
          file kernel.raw 2>/dev/null || file $(ls -1 | grep -v -E '\.(zip|md|yml|py)$' | head -1)

      - name: Install dependencies
        run: |
          brew install openjdk wget unzip || true
          echo "$(brew --prefix openjdk)/bin" >> $GITHUB_PATH

      - name: Download Ghidra
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip
          unzip -q ghidra_11.0.3_PUBLIC_20240410.zip
          echo "GHIDRA=$(pwd)/ghidra_11.0.3_PUBLIC" >> $GITHUB_ENV

      - name: Run Ghidra Headless
        run: |
          mkdir -p /tmp/proj
          KERNEL=$(ls -1 | grep -E 'kernel\.raw$' | head -1)
          echo "Analyzing: $KERNEL"
          $GHIDRA/support/analyzeHeadless /tmp/proj ios27 \
            -import "$KERNEL" \
            -postScript find_offsets.py \
            -scriptPath scripts \
            -deleteProject

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: offsets
          path: offsets.txt
          if-no-files-found: error
